[package]
name = "dock-switch"
version = "0.1.0"
edition = "2024"
description = "Windows-style Super+Number app switching for the COSMIC desktop"
license = "MIT"
publish = false

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
rustix = { version = "1", features = ["event"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
